<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contact.css">
    <title>Settings</title>
</head>
<body class="settings">
    <!-- navbar -->
    <div class="nav">
        <div class="logo">
            <a href="contact.html">Contact</a>
        </div>
        <div class="hamburger">
            <img src="ham-menu.png" alt="">
        </div>
        <div class="crossbtn">
            <img src="cross.png" alt="">
        </div>
    </div>
    <div class="categories">
        <div class="cat"><a href="recent.html">Recent</a></div>
        <div class="cat"><a href="savednumbers.html">Saved Numbers</a></div>
        <div class="cat"><a href="settings.html">Settings</a></div>
        <div class="cat"><a href="addcontact.html"><img src="plus-icon.png" alt=""></a></div>
    </div>

    <!-- settings -->
    <div class="mode">
        <div class="desc">Display mode</div>
        <div class="dropdown">
            <button class="dropbtn" id="displaymode">Default</button>
            <div class="drop-content">
            <div class="option" data-value="default">Default</div>
            <div class="option" data-value="light">Light</div>
            <div class="option" data-value="dark">Dark</div>
            </div>
        </div>
    </div>
        
    </div>
    <div class="settone">
        <div class="desc">
            <p>Set ringtone</p>
            <span>Current: Rainbow.mp4</span>
        </div>
    </div>
    <div class="colorcustomize">
        <div class="desc">Accent Color</div>
    </div>
    <div class="clearhistory">
        <div class="desc">Clear history</div>
            <div class="clearhistorycont">
                <div class="bin"><img src="delete.png" alt=""></div>
                <div class="dropdown">
                    <Button class="dropbtn">Last hour</Button>
                    <div class="dropcont">
                        <div class="option">Last 6 hours</div>
                        <div class="option">Last 12 hours</div>
                        <div class="option">Last 24 hours</div>
                        <div class="option">Last week</div>
                        <div class="option">Delete all</div>
                    </div>
                </div>
            </div>
    </div>
    <div class="soundtoggle">
        <div class="desc">
            <p>Keypad Sound Toggle</p>
            <span>Current: bip bip.mp4</span>
        </div>
    </div>
    <div class="emergency">
        <div class="desc">Emergency Numbers</div>
    </div>
    <div class="trash">
        <div class="desc">Trash</div>
    </div>

    <script src="contact.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
